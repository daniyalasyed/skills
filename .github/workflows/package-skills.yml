name: Package skills

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/skills/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build one zip per skill
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          # Each skill lives at plugins/<plugin>/skills/<skill>/SKILL.md.
          # Zip the skill FOLDER as the archive root - Claude rejects an
          # archive whose files sit loose at the top level.
          find plugins -type f -name SKILL.md | while read -r f; do
            dir=$(dirname "$f")
            name=$(basename "$dir")
            (cd "$(dirname "$dir")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
            echo "packaged $name"
          done
          ls -la dist

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Rebuild skill packages [skip ci]"
            git push
          fi
